<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" role="img" aria-label="Comparación de los cuatro patrones de arquitectura">
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Data warehouse -->
    <rect x="20" y="30" width="280" height="540" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="20" y="30" width="280" height="60" rx="10" fill="#2A4D40" />
    <text x="160" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">Data warehouse</text>
    <g>
      <rect x="70" y="130" width="180" height="34" rx="4" fill="#EAF0ED" stroke="#A9BEBD" />
      <rect x="70" y="172" width="180" height="34" rx="4" fill="#EAF0ED" stroke="#A9BEBD" />
      <rect x="70" y="214" width="180" height="34" rx="4" fill="#EAF0ED" stroke="#A9BEBD" />
      <text x="160" y="275" text-anchor="middle" font-size="20" fill="#7E9A8E">datos limpios</text>
      <text x="160" y="300" text-anchor="middle" font-size="20" fill="#7E9A8E">y estructurados</text>
    </g>
    <line x1="45" y1="330" x2="275" y2="330" stroke="#EAF0ED" stroke-width="2" />
    <text x="45" y="375" font-size="21" fill="#3D6558">Foco: reportes confiables</text>
    <text x="45" y="420" font-size="21" fill="#3D6558">Tiempo real: no</text>
    <text x="45" y="465" font-size="21" fill="#3D6558">Riesgo: poco flexible</text>

    <!-- Data lake -->
    <rect x="330" y="30" width="280" height="540" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="330" y="30" width="280" height="60" rx="10" fill="#507A6E" />
    <text x="470" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">Data lake</text>
    <g>
      <path d="M395,130 L545,130 L530,250 L410,250 Z" fill="#EAF0ED" stroke="#A9BEBD" stroke-width="2" />
      <circle cx="440" cy="165" r="14" fill="#7E9A8E" />
      <rect x="470" y="150" width="40" height="30" rx="3" fill="#DABC6E" />
      <path d="M430,205 L520,205" stroke="#507A6E" stroke-width="4" />
      <path d="M450,225 L500,225" stroke="#507A6E" stroke-width="4" />
      <text x="470" y="290" text-anchor="middle" font-size="20" fill="#7E9A8E">datos crudos y diversos</text>
    </g>
    <line x1="355" y1="330" x2="585" y2="330" stroke="#EAF0ED" stroke-width="2" />
    <text x="355" y="375" font-size="21" fill="#3D6558">Foco: guardar todo</text>
    <text x="355" y="420" font-size="21" fill="#3D6558">Tiempo real: no</text>
    <text x="355" y="465" font-size="21" fill="#3D6558">Riesgo: pantano de datos</text>

    <!-- Data lakehouse -->
    <rect x="640" y="30" width="280" height="540" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="640" y="30" width="280" height="60" rx="10" fill="#7E9A8E" />
    <text x="780" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">Data lakehouse</text>
    <g>
      <path d="M705,130 L855,130 L840,235 L720,235 Z" fill="#EAF0ED" stroke="#A9BEBD" stroke-width="2" />
      <rect x="735" y="150" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#507A6E" />
      <rect x="735" y="185" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#507A6E" />
      <text x="780" y="290" text-anchor="middle" font-size="20" fill="#7E9A8E">crudo + esquema y gobierno</text>
    </g>
    <line x1="665" y1="330" x2="895" y2="330" stroke="#EAF0ED" stroke-width="2" />
    <text x="665" y="375" font-size="21" fill="#3D6558">Foco: analizar ambos mundos</text>
    <text x="665" y="420" font-size="21" fill="#3D6558">Tiempo real: parcial</text>
    <text x="665" y="465" font-size="21" fill="#3D6558">Costo: más madurez</text>

    <!-- Lambda -->
    <rect x="950" y="30" width="280" height="540" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="950" y="30" width="280" height="60" rx="10" fill="#DABC6E" />
    <text x="1090" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="#2A4D40">Lambda</text>
    <g>
      <rect x="990" y="130" width="200" height="46" rx="6" fill="#EAF0ED" stroke="#507A6E" stroke-width="2" />
      <text x="1090" y="160" text-anchor="middle" font-size="21" fill="#2A4D40">capa batch</text>
      <rect x="990" y="190" width="200" height="46" rx="6" fill="#EAF0ED" stroke="#DABC6E" stroke-width="2" />
      <text x="1090" y="220" text-anchor="middle" font-size="21" fill="#2A4D40">capa de velocidad</text>
      <text x="1090" y="290" text-anchor="middle" font-size="20" fill="#7E9A8E">lote + tiempo real</text>
    </g>
    <line x1="975" y1="330" x2="1205" y2="330" stroke="#EAF0ED" stroke-width="2" />
    <text x="975" y="375" font-size="21" fill="#3D6558">Foco: reportes y alertas</text>
    <text x="975" y="420" font-size="21" fill="#3D6558">Tiempo real: sí</text>
    <text x="975" y="465" font-size="21" fill="#3D6558">Costo: dos lógicas</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Tres preguntas que responde la arquitectura de datos">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#507A6E" />
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="50" width="360" height="400" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="30" y="50" width="360" height="12" rx="6" fill="#DABC6E" />
    <text x="210" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A4D40">¿Dónde vive</text>
    <text x="210" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A4D40">cada dato?</text>
    <path d="M210,205 L210,285" stroke="#507A6E" stroke-width="4" marker-end="url(#a)" />
    <rect x="70" y="305" width="280" height="86" rx="8" fill="#EAF0ED" stroke="#507A6E" stroke-width="2" />
    <text x="210" y="356" text-anchor="middle" font-size="28" fill="#2A4D40">Almacenamiento</text>

    <rect x="420" y="50" width="360" height="400" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="420" y="50" width="360" height="12" rx="6" fill="#DABC6E" />
    <text x="600" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A4D40">¿Cómo se mueve</text>
    <text x="600" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A4D40">y transforma?</text>
    <path d="M600,205 L600,285" stroke="#507A6E" stroke-width="4" marker-end="url(#a)" />
    <rect x="460" y="305" width="280" height="86" rx="8" fill="#EAF0ED" stroke="#507A6E" stroke-width="2" />
    <text x="600" y="356" text-anchor="middle" font-size="28" fill="#2A4D40">Procesamiento</text>

    <rect x="810" y="50" width="360" height="400" rx="10" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" />
    <rect x="810" y="50" width="360" height="12" rx="6" fill="#DABC6E" />
    <text x="990" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A4D40">¿Quién puede usarlo</text>
    <text x="990" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A4D40">y con qué reglas?</text>
    <path d="M990,205 L990,285" stroke="#507A6E" stroke-width="4" marker-end="url(#a)" />
    <rect x="850" y="305" width="280" height="86" rx="8" fill="#EAF0ED" stroke="#507A6E" stroke-width="2" />
    <text x="990" y="345" text-anchor="middle" font-size="26" fill="#2A4D40">Acceso y</text>
    <text x="990" y="376" text-anchor="middle" font-size="26" fill="#2A4D40">gobernanza</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-label="Esquema de arquitectura sin etiquetas para practicar">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#507A6E" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="640" fill="#F5F3EB" />

  <!-- Capas transversales -->
  <rect x="0" y="52" width="1040" height="58" fill="#DABC6E" opacity="0.22" />
  <text x="20" y="88" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2A4D40">Capa 1</text>
  <rect x="0" y="550" width="1040" height="58" fill="#DABC6E" opacity="0.22" />
  <text x="20" y="586" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2A4D40">Capa 2</text>

  <!-- Fuentes -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="170" width="170" height="72" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="145" y="214" font-size="22" fill="#2A4D40">Caja A</text>
    <rect x="295" y="170" width="170" height="72" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="380" y="214" font-size="22" fill="#2A4D40">Caja B</text>
    <rect x="530" y="170" width="170" height="72" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="615" y="214" font-size="22" fill="#2A4D40">Caja C</text>

    <!-- Flujo -->
    <rect x="60" y="380" width="210" height="88" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="165" y="432" font-size="24" fill="#2A4D40">Caja D</text>
    <rect x="315" y="380" width="210" height="88" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="420" y="432" font-size="24" fill="#2A4D40">Caja E</text>
    <rect x="570" y="380" width="210" height="88" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="675" y="432" font-size="24" fill="#2A4D40">Caja F</text>
    <rect x="825" y="380" width="180" height="88" fill="#FFFFFF" stroke="#A9BEBD" stroke-width="2" rx="6" />
    <text x="915" y="432" font-size="24" fill="#2A4D40">Caja G</text>
  </g>

  <!-- Flechas: indican el flujo entre cajas; no son un componente y no se etiquetan -->
  <g stroke="#507A6E" stroke-width="3" fill="none">
    <path d="M145,242 C145,320 160,340 168,378" marker-end="url(#arw)" />
    <path d="M380,242 C380,320 190,340 182,378" marker-end="url(#arw)" />
    <path d="M615,242 C615,320 200,350 198,378" marker-end="url(#arw)" />
    <path d="M270,424 L313,424" marker-end="url(#arw)" />
    <path d="M525,424 L568,424" marker-end="url(#arw)" />
    <path d="M780,424 L823,424" marker-end="url(#arw)" />
  </g>
</svg>

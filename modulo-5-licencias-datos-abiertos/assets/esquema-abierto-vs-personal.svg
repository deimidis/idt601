<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-labelledby="t d">
  <title id="t">Datos abiertos frente a datos personales</title>
  <desc id="d">Se publica el dato agregado; no se publica el dato personal. En el medio, anonimizar y agregar.</desc>
  <rect x="0" y="0" width="1400" height="490" fill="#F5F3EB"/>
  <text x="100" y="64" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2A4D40">Abrir el dato agregado, proteger el individual</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="100" y="110" width="380" height="250" rx="6" fill="#FFFFFF" stroke="#A9BEBD"/>
    <rect x="100" y="110" width="380" height="8" fill="#507A6E"/>
    <text x="128" y="160" font-size="24" font-weight="700" fill="#2A4D40">Sí se publica</text>
    <text x="128" y="205" font-size="19" fill="#3D6558">Dato agregado:</text>
    <text x="128" y="235" font-size="19" fill="#3D6558">cantidad de beneficiarios</text>
    <text x="128" y="261" font-size="19" fill="#3D6558">por municipio.</text>
    <text x="128" y="315" font-size="18" font-style="italic" fill="#507A6E">No identifica a personas.</text>

    <rect x="510" y="110" width="380" height="250" rx="6" fill="#FFFFFF" stroke="#A9BEBD"/>
    <rect x="510" y="110" width="380" height="8" fill="#DABC6E"/>
    <text x="538" y="160" font-size="24" font-weight="700" fill="#2A4D40">En el medio</text>
    <text x="538" y="205" font-size="19" fill="#3D6558">Anonimizar: quitar o</text>
    <text x="538" y="231" font-size="19" fill="#3D6558">alterar identificadores.</text>
    <text x="538" y="271" font-size="19" fill="#3D6558">Agregar: agrupar y</text>
    <text x="538" y="297" font-size="19" fill="#3D6558">resumir totales.</text>

    <rect x="920" y="110" width="380" height="250" rx="6" fill="#FFFFFF" stroke="#A9BEBD"/>
    <rect x="920" y="110" width="380" height="8" fill="#2A4D40"/>
    <text x="948" y="160" font-size="24" font-weight="700" fill="#2A4D40">No se publica</text>
    <text x="948" y="205" font-size="19" fill="#3D6558">Dato personal:</text>
    <text x="948" y="235" font-size="19" fill="#3D6558">listado con DNI y</text>
    <text x="948" y="261" font-size="19" fill="#3D6558">domicilio; salud.</text>
    <text x="948" y="315" font-size="18" font-style="italic" fill="#2A4D40">Identifica a personas.</text>

    <rect x="100" y="400" width="1200" height="52" rx="6" fill="#2A4D40"/>
    <text x="700" y="434" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Datos abiertos ≠ datos personales: la apertura nunca expone a las personas.</text>
  </g>
</svg>

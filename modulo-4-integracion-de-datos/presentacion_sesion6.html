<div class="topline"><span class="kicker">03 / Integración</span><span class="mark">Una sola historia</span></div>
<div class="content">
  <div><h2 class="slide-title">Integrar datos: ¿qué significa?</h2><p class="body-copy">Reunir datos de <strong>fuentes distintas</strong> en un <strong>destino común y coherente</strong>. Sin integración, cada sistema cuenta su parte y nadie tiene la foto completa.</p></div>
  <div><div class="card"><h3>Ejemplo</h3><div class="code">trámites · recaudación · reclamos</div><p>Tres sistemas del municipio que, integrados, se cruzan en un solo tablero.</p></div></div>
</div>
<div class="footer"><span>Integración</span><span>04</span></div>

Note:
- Definir con palabras simples: integrar es **reunir datos de fuentes distintas** en un **destino común y coherente**.
- Contar el ejemplo del municipio: trámites en un sistema, recaudación en otro y reclamos en una planilla; integrados se cruzan en un solo tablero.
- Subrayar la consecuencia de no integrar: cada sistema cuenta su parte y **nadie tiene la foto completa**.
- Preguntar al grupo qué sistemas de su institución necesitarían cruzarse para armar un informe de gestión.
- **No olvidar:** instalar la idea de que los datos deben contar **una sola historia**, y anunciar que la herramienta clásica es el **ETL**.

<div class="topline"><span class="kicker">04 / ETL</span><span class="mark">Tres etapas</span></div>
<div class="content single"><h2 class="slide-title">El proceso ETL, paso a paso</h2>
  <div class="flow">
    <div class="flow-step"><strong>E — Extraer</strong><p>Tomar los datos desde la fuente: bases de datos, planillas, archivos, APIs.</p></div>
    <div class="flow-arrow">→</div>
    <div class="flow-step"><strong>T — Transformar</strong><p>Limpiar, ordenar y convertir a un formato común.</p></div>
    <div class="flow-arrow">→</div>
    <div class="flow-step"><strong>L — Cargar</strong><p>Guardar los datos listos en el almacén o archivo consolidado.</p></div>
  </div>
</div>
<div class="footer"><span>Proceso ETL</span><span>05</span></div>

Note:
- Escribir en la pizarra el proceso en tres etapas y en orden: **E — Extraer → T — Transformar → L — Cargar**.
- Explicar cada etapa: extraer es **tomar el dato de la fuente** (bases, planillas, archivos, APIs); transformar es **limpiar y convertir**; cargar es **guardar listo** en el almacén.
- Usar el símil de la **planta de envasado**: recibe la materia prima, la lava y selecciona, y la despacha al depósito.
- Dar el ejemplo de las ventas de sucursales: tomarlas todas, unificar fechas y montos, y guardarlas en el almacén para los reportes.
- **No olvidar:** el resumen memorable **"tomar → arreglar → guardar"**: el producto final son **datos listos para usar**.


---

<div class="topline"><span class="kicker">04 / ETL</span><span class="mark">ELT</span></div>
<div class="content">
  <div><h2 class="slide-title">ELT: cargar primero, transformar después</h2><p class="body-copy"><strong>E</strong>xtraer → <strong>L</strong>oad (cargar) → <strong>T</strong>ransformar. Los datos llegan <strong>crudos al destino</strong> y se transforman <strong>allí dentro</strong>. La carga es más rápida y flexible.</p></div>
  <div><div class="card"><h3>Ejemplo</h3><div class="code">volcar → calcular dentro</div><p>Volcar los registros crudos de todas las cajas de recaudación a un lago de datos y calcular los totales después.</p></div></div>
</div>
<div class="footer"><span>ELT</span><span>06</span></div>

Note:
- Explicar **ELT**: Extraer → Cargar → Transformar. Se guarda primero en crudo y se transforma después, dentro del propio destino.
- Señalar el requisito: el destino debe ser **potente** (nube o data lake) para procesar grandes volúmenes.
- Dar el ejemplo boliviano: volcar los registros crudos de las cajas de recaudación a un lago y calcular los totales por municipio después.
- Contrastar con ETL en una frase: ETL arregla antes de guardar; ELT guarda y arregla dentro.
- **No olvidar:** no hay uno mejor; ELT conviene con **gran volumen y destino flexible**.

---

<div class="topline"><span class="kicker">05 / Comparación</span><span class="mark">ETL vs. ELT</span></div>
<div class="content single"><h2 class="slide-title">Transformar antes o después de guardar</h2>
  <table class="type-table">
    <thead><tr><th>Aspecto</th><th>ETL</th><th>ELT</th></tr></thead>
    <tbody>
      <tr><td>Orden</td><td>Extraer → Transformar → Cargar</td><td>Extraer → Cargar → Transformar</td></tr>
      <tr><td>Dónde transforma</td><td>Antes de guardar</td><td>Después de guardar</td></tr>
      <tr><td>Velocidad de carga</td><td>Menor</td><td>Mayor</td></tr>
      <tr><td>Flexibilidad</td><td>Menor</td><td>Mayor</td></tr>
      <tr><td>Conviene cuando</td><td>Destino rígido, poco volumen</td><td>Gran volumen, nube o data lake</td></tr>
    </tbody>
  </table>
</div>
<div class="footer"><span>ETL vs. ELT</span><span>07</span></div>

Note:
- Aclarar que el orden de las letras no es un detalle: cambia **cuándo** y **dónde** se transforman los datos.
- Explicar **ETL**: transforma antes de cargar; el destino queda ordenado desde el inicio, pero requiere un espacio intermedio y puede demorar con grandes volúmenes.
- Explicar **ELT**: carga primero en crudo y transforma después dentro del destino; carga rápida y flexible, pero exige un destino potente (nube o data lake).
- Contrastar con los ejemplos bolivianos: planillas de hospitales a formato común (**ETL**) y cajas de recaudación a un lago de datos (**ELT**).
- **No olvidar:** no hay uno mejor que otro: **depende del volumen y del destino**; los dos buscan dejar datos listos para usar.

<div class="topline"><span class="kicker">06 / Herramientas</span><span class="mark">Dos familias</span></div>
<div class="content single"><h2 class="slide-title">Herramientas de integración</h2>
  <table class="type-table">

  </table>
</div>
<div class="footer"><span>Herramientas de integración</span><span>08</span></div>

<div class="topline"><span class="kicker">06 / Herramientas</span><span class="mark">Lado a lado</span></div>
<div class="content single"><h2 class="slide-title">¿Cuál elegir? Depende del caso</h2>
  <div class="split">
    <div class="split-panel"><h3>Comerciales</h3><p>Pagadas, con interfaz visual y soporte formal. Convienen a instituciones con presupuesto y equipos poco técnicos.</p></div>

</div>

- Preguntar quién conoce o usa alguna de estas herramientas en su institución.

<div class="topline"><span class="kicker">07 / Transformación</span><span class="mark">Limpieza</span></div>
<div class="content single"><h2 class="slide-title">Limpieza y preparación de datos</h2>
  <div class="cards">
    <article class="card"><h3>Corregir y unificar</h3><p>Fechas inválidas, montos negativos, tildes y mayúsculas: "La Paz" y "LA PAZ".</p></article>
    <article class="card"><h3>Deduplicar y filtrar</h3><p>Un trámite registrado dos veces; quedarse con las columnas relevantes.</p></article>
    <article class="card"><h3>Combinar y marcar</h3><p>Cruzar padrón y recaudación; marcar zonas sin registrar sin inflar totales.</p></article>
  </div>
  <p class="body-copy">Es donde más tiempo se gasta en un proyecto real: <strong>datos sucios producen reportes sucios</strong>.</p>
</div>
<div class="footer"><span>Limpieza de datos</span><span>10</span></div>

Note:
- Enmarcar la limpieza como el corazón de la transformación: es donde **más tiempo se gasta** en un proyecto real.
- Recorrer las tareas concretas: **corregir** errores, **unificar** formatos, **eliminar duplicados**, **marcar faltantes** y **combinar tablas**.
- Dar el ejemplo del reporte mensual de reclamos: unificar "Macrodistrito Centro" y "centro", descartar duplicados y marcar "sin zona".
- Repetir la idea de la pizarra: **datos sucios producen reportes sucios**.
- **No olvidar:** limpiar no es opcional; decidir si los faltantes se completan o se excluyen, **sin inflar totales**.

<div class="topline"><span class="kicker">08 / Automatización</span><span class="mark">Que corra solo</span></div>
<div class="content">
  <div><h2 class="slide-title">Automatización</h2><p class="body-copy">Hacer que <strong>una tarea se ejecute sola</strong>, sin intervención manual. Se apoya en <strong>programar</strong> cuándo corre y <strong>avisar</strong> si algo sale mal.</p></div>
  <div><div class="card"><h3>Ejemplo</h3><div class="code">lunes 06:00 → reporte</div><p>El reporte de recaudación se genera solo y llega por correo a quien lo necesita.</p></div></div>
</div>
<div class="footer"><span>Automatización</span><span>11</span></div>

Note:
- Definir automatizar como hacer que **una tarea se ejecute sola**, sin que una persona la dispare cada vez.
- Explicar sus dos apoyos: **programar** cuándo debe correr y **avisar** si algo sale mal.
- Dar el ejemplo del reporte de recaudación que se genera solo **los lunes a las 6:00** y llega por correo a quien lo necesita.
- Lanzar la pregunta al grupo: *"¿qué tarea repetitiva de su trabajo harían que se ejecute sola?"* (reportes, respaldos, resúmenes).
- **No olvidar:** automatizar es **que corra solo**; la diferencia con orquestar aparece en el slide siguiente.

---

<div class="topline"><span class="kicker">09 / Orquestación</span><span class="mark">En orden</span></div>
<div class="content">
  <div><h2 class="slide-title">Orquestación</h2><p class="body-copy"><strong>Coordinar varias tareas</strong> que dependen unas de otras, en el <strong>orden correcto</strong>. Incluye dependencias, reintentos y avisos ante fallas.</p></div>
  <div><div class="card"><h3>Ejemplo</h3><div class="code">descargar → transformar → cargar → avisar</div><p>Si un paso falla, se avisa y se reintenta. Como un director de orquesta.</p></div></div>
</div>
<div class="footer"><span>Orquestación</span><span>12</span></div>

Note:
- Definir orquestar como **coordinar varias tareas** que dependen unas de otras, asegurando el **orden correcto**.
- Explicar qué maneja: **dependencias** (la tarea B espera a la A), **reintentos** y **avisos** ante fallas.
- Recorrer el ejemplo del flujo: descargar → transformar → cargar al almacén → enviar resumen.
- Usar el símil del **director de orquesta**: no toca instrumentos, pero asegura que cada músico entre a tiempo y en orden.
- **No olvidar:** si un paso falla, hay que **avisar y reintentar**: orquestar es que corra en orden y coordinado.

---

<div class="topline"><span class="kicker">10 / Beneficios</span><span class="mark">Por qué importa</span></div>
<div class="content single"><h2 class="slide-title">¿Por qué importa?</h2>
  <div class="cards">
    <article class="card"><h3>Menos errores</h3><p>Lo repetitivo hecho a mano falla; el flujo programado, no.</p></article>
    <article class="card"><h3>Ahorro de tiempo</h3><p>La gente deja de hacer lo repetitivo y gana tiempo para analizar.</p></article>
    <article class="card"><h3>Trazabilidad</h3><p>Se sabe qué corrió, cuándo y con qué resultado: sirve para auditar.</p></article>
  </div>
</div>
<div class="footer"><span>Beneficios</span><span>13</span></div>

Note:
- Recorrer los tres beneficios: **menos errores** (lo repetitivo hecho a mano falla), **ahorro de tiempo** y **trazabilidad**.
- Explicar la trazabilidad: se sabe **qué corrió, cuándo y con qué resultado**, algo clave para auditar y rendir cuentas.
- Traducirlo a la gestión pública: menos horas copiando y pegando, más tiempo para analizar y decidir.
- Reforzar el par conceptual escrito en la pizarra.
- **No olvidar:** automatizar es **que corra solo**; orquestar es **que corra en orden y coordinado**.

<div class="topline"><span class="kicker">11 / Orquestación</span><span class="mark">Cron</span></div>
<div class="content">
  <div><h2 class="slide-title">Cron: el más simple</h2><p class="body-copy">El <strong>programador de tareas</strong> del sistema operativo. Se define una <strong>frecuencia</strong> y un <strong>comando</strong>.</p></div>
  <div><div class="card"><h3>Cuándo usarlo</h3><div class="code">0 6 * * 1 → lunes 6:00</div><p>Tareas simples y aisladas, sin dependencias complejas.</p></div></div>
</div>
<div class="footer"><span>Cron</span><span>14</span></div>

Note:
- Presentar **cron** como el programador de tareas del sistema operativo: lo más simple que existe.
- Explicar que se define una **frecuencia** y un **comando**, y leer el ejemplo `0 6 * * 1` = "todos los lunes a las 6:00".
- Aclarar cuándo conviene: tareas **simples y aisladas**, sin dependencias complejas.
- Anticipar que con esto alcanza para el taller: no hace falta una plataforma grande.
- **No olvidar:** empezar simple: para una **tarea suelta, cron alcanza**.

---

<div class="topline"><span class="kicker">11 / Orquestación</span><span class="mark">Airflow</span></div>
<div class="content">
  <div><h2 class="slide-title">Apache Airflow</h2><p class="body-copy">Plataforma de <strong>orquestación de flujos de trabajo</strong>. Los flujos se definen como <strong>DAGs</strong>: cada nodo es una tarea y las flechas marcan el orden.</p></div>
  <div><div class="card"><h3>Cuándo usarlo</h3><div class="code">DAG = tareas + orden</div><p>Flujos con varias etapas que dependen unas de otras y requieren monitoreo, reintentos y alertas.</p></div></div>
</div>
<div class="footer"><span>Apache Airflow</span><span>15</span></div>

Note:
- Presentar **Apache Airflow** como plataforma de **orquestación de flujos de trabajo**, estándar en ingeniería de datos.
- Explicar los **DAGs**: cada nodo es una tarea y las flechas marcan el orden.
- Destacar lo que aporta: **interfaz web**, programación, **reintentos** y **alertas**.
- Aclarar cuándo conviene: flujos con varias etapas dependientes que requieren monitoreo.
- **No olvidar:** mencionar las alternativas (Dagster, Prefect, Luigi) y los programadores de nube (Azure Scheduler, Cloud Scheduler, EventBridge).

---

<div class="topline"><span class="kicker">11 / Orquestación</span><span class="mark">Cron y Airflow</span></div>
<div class="content single"><h2 class="slide-title">De lo simple a lo complejo</h2>
  <table class="type-table">
    <thead><tr><th>Herramienta</th><th>Complejidad</th><th>Dependencias</th><th>Cuándo usarla</th></tr></thead>
    <tbody>
      <tr><td>Cron</td><td>Baja</td><td>No</td><td>Tareas simples por horario (0 6 * * 1 = lunes 6:00).</td></tr>
      <tr><td>Programador de nube</td><td>Baja</td><td>Limitadas</td><td>Tareas simples en la nube.</td></tr>
      <tr><td>Apache Airflow</td><td>Media-alta</td><td>Sí (DAGs)</td><td>Flujos complejos con monitoreo y alertas.</td></tr>
    </tbody>
  </table>
</div>
<div class="footer"><span>Herramientas de orquestación</span><span>16</span></div>

Note:
- Recorrer la tabla criterio por criterio: complejidad, dependencias entre tareas y cuándo usarla.
- Contrastar: **cron** de complejidad baja y sin dependencias, frente a **Airflow** de complejidad media-alta con DAGs y monitoreo.
- Incluir al programador de nube como punto medio: simple, en la nube, con dependencias limitadas.
- Traducir a la regla práctica y anunciar que ahora toca diseñar el flujo que corre solo.
- **No olvidar:** para una **tarea suelta, cron alcanza**; para **flujos complejos con aviso de fallas, Airflow**.

<div class="topline"><span class="kicker">12 / En la práctica</span><span class="mark">65 minutos</span></div>
<div class="content single"><h2 class="slide-title">Automatizar el pipeline de reclamos</h2>
  <div class="cards">
